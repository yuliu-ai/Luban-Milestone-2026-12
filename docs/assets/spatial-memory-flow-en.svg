<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 390" role="img" aria-labelledby="title"><title id="title">Structured scene and persistent spatial memory</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#007f89"/></marker></defs><rect width="1160" height="390" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="36" y="40" font-size="25" fill="#15324c" text-anchor="start" font-weight="650">From reconstruction to task memory</text><rect x="36" y="74" width="246" height="142" rx="12" fill="#f4f8fa" stroke="#d7e1e8" stroke-width="1.6"/><text x="53" y="114" font-size="22" fill="#15324c" text-anchor="start" font-weight="650">Scene point cloud</text><text x="53" y="151" font-size="15" fill="#51667a" text-anchor="start" font-weight="400">685,513 points</text><text x="53" y="180" font-size="15" fill="#51667a" text-anchor="start" font-weight="400">scene0000_00</text><path d="M282 145H313" fill="none" stroke="#007f89" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="318" y="74" width="246" height="142" rx="12" fill="#f4f8fa" stroke="#d7e1e8" stroke-width="1.6"/><text x="335" y="114" font-size="22" fill="#15324c" text-anchor="start" font-weight="650">SpatialLM</text><text x="335" y="151" font-size="15" fill="#51667a" text-anchor="start" font-weight="400">1.1-Qwen-0.5B</text><text x="335" y="180" font-size="15" fill="#51667a" text-anchor="start" font-weight="400">Inference 3.368 s</text><path d="M564 145H595" fill="none" stroke="#007f89" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="600" y="74" width="246" height="142" rx="12" fill="#f4f8fa" stroke="#007f89" stroke-width="1.6"/><text x="617" y="114" font-size="22" fill="#15324c" text-anchor="start" font-weight="650">Structured scene</text><text x="617" y="151" font-size="15" fill="#51667a" text-anchor="start" font-weight="400">6 walls, 2 openings, 8 objects</text><text x="617" y="180" font-size="15" fill="#51667a" text-anchor="start" font-weight="400">Centers, sizes and orientation</text><path d="M846 145H877" fill="none" stroke="#007f89" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="882" y="74" width="246" height="142" rx="12" fill="#f4f8fa" stroke="#d7e1e8" stroke-width="1.6"/><text x="899" y="114" font-size="22" fill="#15324c" text-anchor="start" font-weight="650">Planner queries</text><text x="899" y="151" font-size="15" fill="#51667a" text-anchor="start" font-weight="400">Nearby objects and goal position</text><text x="899" y="180" font-size="15" fill="#51667a" text-anchor="start" font-weight="400">Read about 2 KB of context</text><rect x="36" y="252" width="1092" height="106" rx="12" fill="#eaf5f4" stroke="#007f89" stroke-width="1.6"/><text x="65" y="294" font-size="29" fill="#007f89" text-anchor="start" font-weight="650">1</text><text x="65" y="330" font-size="16" fill="#51667a" text-anchor="start" font-weight="400">Scene parse call</text><text x="320" y="294" font-size="29" fill="#007f89" text-anchor="start" font-weight="650">1,000</text><text x="320" y="330" font-size="16" fill="#51667a" text-anchor="start" font-weight="400">resets, identical scene</text><text x="615" y="294" font-size="29" fill="#007f89" text-anchor="start" font-weight="650">0.1496 ms</text><text x="615" y="330" font-size="16" fill="#51667a" text-anchor="start" font-weight="400">Mean recall latency</text><text x="930" y="294" font-size="29" fill="#007f89" text-anchor="start" font-weight="650">2,009 B</text><text x="930" y="330" font-size="16" fill="#51667a" text-anchor="start" font-weight="400">Spatial context size</text></g></svg>