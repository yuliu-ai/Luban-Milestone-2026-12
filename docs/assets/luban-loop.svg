<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" role="img" aria-labelledby="title desc"><title id="title">Luban execution loop</title><desc id="desc">A task enters planning, policy inference, environment execution and verification. Feedback returns to planning; memory records the episode. Runtime bounds the loop.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#56828e"/></marker></defs><rect x="1" y="1" width="1118" height="298" rx="20" fill="#f0f7fa" stroke="#d2e3e9"/><g font-family="Arial,Helvetica,sans-serif" fill="#18364e"><text x="36" y="41" font-size="18" font-weight="700">RUNTIME</text><text x="180" y="41" font-size="17">Step budgets · retries · timeouts · explicit termination</text></g><g fill="#fff" stroke="#b4d6dc"><rect x="36" y="82" width="205" height="100" rx="14"/><rect x="316" y="82" width="205" height="100" rx="14"/><rect x="596" y="82" width="205" height="100" rx="14"/><rect x="876" y="82" width="205" height="100" rx="14"/></g><g font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#18364e"><g font-size="23" font-weight="700"><text x="138" y="123">Plan</text><text x="418" y="123">Infer</text><text x="698" y="123">Execute</text><text x="978" y="123">Verify</text></g><g font-size="16"><text x="138" y="153">Task → next instruction</text><text x="418" y="153">Observation → actions</text><text x="698" y="153">Actions → environment</text><text x="978" y="153">Feedback → decision</text></g></g><g fill="none" stroke="#56828e" stroke-width="2" marker-end="url(#arrow)"><path d="M242 132H301"/><path d="M522 132H581"/><path d="M802 132H861"/><path d="M978 183V225H138V191"/></g><rect x="400" y="210" width="320" height="30" rx="15" fill="#f0f7fa"/><g font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#365e6a" font-size="16"><text x="560" y="231">Feedback informs the next step</text><text x="560" y="275">MEMORY &amp; RECORDER  ·  Facts, events, results and replay</text></g></svg>