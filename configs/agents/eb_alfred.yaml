agent:
  class_path: luban.agent_core.DefaultAgent

planner:
  class_path: luban.agent_core.LanguageSkillPlanner
  init_args:
    backend:
      class_path: luban.backends.llm.OpenAICompatibleLLMBackend
      init_args:
        base_url: "${LLM_BASE_URL:-http://127.0.0.1:8000/v1}"
        model: "${LLM_MODEL:-replace-with-your-model-id}"
        timeout_seconds: 120
        max_retries: 2
    max_tokens: 1024
    temperature: 0

skill_backend:
  class_path: luban.backends.skills.LanguageSkillBackend

verifier:
  class_path: luban.agent_core.EnvironmentVerifier

memory:
  class_path: luban.agent_core.InMemoryMemory
