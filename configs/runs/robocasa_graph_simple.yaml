# Bounded multimodal task-graph run using the existing ScrubCuttingBoard catalog binding.
agent_config: ../agents/xr1_graph_simple.yaml
pipeline:
  class_path: luban.pipelines.AtomicSpatialSkillExecutionPipeline
  init_args:
    perception_clients: []
    perception_required: false
    spatial_memory_enabled: true
    allow_privileged_object_state: false
    atomic_recovery_enabled: false
    require_action_summary: false
    record_deferred_verification: false
    config:
      action_execution_mode: receding_horizon
      execute_steps: 16
      planner_check_interval_chunks: 16
      planner_replan_only: true
      max_chunks_per_skill: 38
      replan_on_chunk_budget: false
      max_attempts_per_execution: 2
      max_uncertain_verifications: 1
      replan_on_uncertain_exhaustion: false
      high_level_replan_limit: 1
      world_model_mode: disabled
      recovery_enabled: false
runtime:
  class_path: luban.runtimes.SyncRuntime
  init_args:
    config:
      max_environment_steps: 600
      max_action_chunks: 38
      max_pipeline_iterations: 80
      max_invalid_actions: 2
      max_retries: 1
      timeout_seconds: 600
      output_dir: runs/robocasa_graph_simple/traces
      observability:
        class_path: luban.observability.LocalEpisodeRecorder
        init_args:
          record_agent_trace: true
          record_video: true
          video_fps: 4
          video_camera_keys:
          - video.robot0_agentview_left
          - video.robot0_agentview_right
          - video.robot0_eye_in_hand
environment:
  class_path: luban.environments.benchmarks.robocasa.RoboCasaEnvironment
  init_args:
    enable_render: true
    render_gpu_device_id: 0
    camera_height: 256
    camera_width: 256
    action_range_policy: official_controller_clip
    available_skills:
    - Close_Door
    - Open_Door
    - Close_Lid
    - Open_Lid
    - Insertion
    - Navigation
    - Pick_Place
    - Press_Button
    - Slide_Rack
    - Turn_Lever
    - Twist_Knob
task:
  name: ScrubCuttingBoard
  split: target
  episode_index: 0
  seed: 7
  horizon: 600
