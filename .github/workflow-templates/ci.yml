name: CPU verification

on:
  push:
    branches: [main, codex/private-readiness]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-cpu:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      GRADIO_ANALYTICS_ENABLED: "False"
      HF_HUB_OFFLINE: "1"
      NO_PROXY: "localhost,127.0.0.1,::1"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.18"
          python-version: "3.11.16"
          enable-cache: false
      - name: Install and verify video prerequisites
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -encoders 2>/dev/null | grep libx264
      - name: Install core only and run both entry points
        run: |
          uv sync --frozen --no-dev
          .venv/bin/python -m luban.examples.offline
          .venv/bin/luban health --agent-config configs/agents/offline.yaml
          .venv/bin/luban run --config configs/runs/offline.yaml
      - name: Install all CPU test dependencies
        run: uv sync --frozen --all-extras --group dev --group docs --group full-test
      - name: Lint, types, all tests, configs, catalogs and docs
        run: REQUIRE_NO_SKIPS=1 bash scripts/ci.sh
      - name: Build documentation
        run: .venv/bin/mkdocs build --strict
      - name: Independent distribution installation and source archive tests
        run: .venv/bin/python scripts/check_distribution.py
